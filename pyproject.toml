[project]
name = "mobilepetv4"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.1",
    "pytest>=9.1.1",
    "torch==2.12.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["Blocks*", "model*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
